; PlatformIO project configuration for the Garden Controller battery-monitor node
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

; --- Common settings shared by every environment -----------------------
[env]
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4
build_flags =
    -D MQTT_MAX_PACKET_SIZE=512

; --- ESP32 node (default) -----------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; --- ESP8266 node (alternate) -------------------------------------------
; Wiring note: the ESP8266's single ADC pin (A0) only tolerates ~1.0V, so
; the battery voltage divider must be sized accordingly (see include/config.h).
[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
